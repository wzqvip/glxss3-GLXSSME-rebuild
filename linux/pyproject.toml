[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glxss"
version = "0.1.0"
description = "GLXSS3/G25 cross-platform cast, UVC, HID and firmware tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyusb>=1.2",
    "numpy>=1.20",
]

[project.optional-dependencies]
capture = ["mss>=9.0"]
image = ["Pillow>=9.0"]
pi = ["Pillow>=9.0", "spidev>=3.5", "RPi.GPIO>=0.7"]
dev = ["Pillow>=9.0", "mss>=9.0"]

[project.scripts]
glxss = "glxss.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glxss*"]
